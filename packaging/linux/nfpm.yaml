# .deb and .rpm packages (nfpm: https://nfpm.goreleaser.com). Run by package.sh, which stages
# the file tree, substitutes its path for ${STAGE} (nfpm doesn't expand env vars in `src`) and
# exports VERSION and NFPM_ARCH.
#
#   nfpm package -f packaging/linux/nfpm.yaml -p deb -t dist/release/
name: youcraft
arch: ${NFPM_ARCH}
platform: linux
version: ${VERSION}
# semver: 0.2.0-rc.1 becomes 0.2.0~rc.1 in deb/rpm, so pre-releases sort before the release.
version_schema: semver
release: 1
section: video
priority: optional
maintainer: ${YOUCRAFT_MAINTAINER}
license: MIT OR Apache-2.0
description: |-
  Native local video player with a searchable library, thumbnails, subtitles,
  audio-track selection and a floating miniplayer. Based on the FilmCraft engine.
  Includes youcraft-cli for shared engine automation.

# Native audio also links ALSA. Windowing (X11/Wayland, xkbcommon) and the
# GPU (Vulkan, EGL/GL) are loaded at runtime, so they are dependencies/recommendations here
# rather than ELF NEEDED entries.
overrides:
  deb:
    depends:
      - libc6 (>= ${YOUCRAFT_GLIBC_MIN})
      - libgcc-s1
      - libxkbcommon0
      - libvulkan1 | libegl1
      - libasound2 | libasound2t64
    recommends:
      - libwayland-client0
      - libx11-6
      - libx11-xcb1
      - libxcursor1
      - libxi6
      - libxrandr2
      - mesa-vulkan-drivers
      - xdg-desktop-portal
  rpm:
    depends:
      # Use the same measured binary requirement as the Debian package.
      - glibc >= ${YOUCRAFT_GLIBC_MIN}
      - libxkbcommon
      - (vulkan-loader or libglvnd-egl)
      - alsa-lib
    recommends:
      - libwayland-client
      - libX11
      - libXcursor
      - libXi
      - libXrandr
      - mesa-vulkan-drivers
      - xdg-desktop-portal

contents:
  - src: ${STAGE}/usr/bin/youcraft
    dst: /usr/bin/youcraft
    file_info: { mode: 0755 }
  - src: ${STAGE}/usr/bin/youcraft-cli
    dst: /usr/bin/youcraft-cli
    file_info: { mode: 0755 }
  - src: ${STAGE}/usr/share/
    dst: /usr/share/
    type: tree

scripts:
  postinstall: packaging/linux/postinst.sh
  postremove: packaging/linux/postinst.sh
